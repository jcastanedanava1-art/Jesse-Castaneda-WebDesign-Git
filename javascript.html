<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="interaction.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resize the Shape</title>
  <link rel="stylesheet" href="interaction.css">
</head>

<body>
  <main>
    <h1>Resize the Shape</h1>

    <p>Move the slider to make the square bigger or smaller.</p>

    <div class="display-area">
      <div id="square"></div>
    </div>

    <label for="size-slider">Change the size:</label>

    <input
      type="range"
      id="size-slider"
      min="50"
      max="220"
      value="100"
    >

    <a href="index.html">Back to my homepage</a>
  </main>

  <script src="interaction.js"></script>
</body>
</html>
